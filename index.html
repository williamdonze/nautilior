<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nautiliar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="game"></div>

    <!-- Voile et vignette par-dessus le rendu 3D -->
    <div id="vignette"></div>

    <!-- HUD -->
    <div id="hud">
      <div class="depth">
        <span class="label">PROFONDEUR</span>
        <span class="value"><span id="depth-value">0000</span><span class="unit">m</span></span>
      </div>
      <div class="depth-gauge"><div id="depth-marker"></div></div>
      <div class="cargo">
        <span class="label">SOUTE</span>
        <span id="cargo-count">00</span>
        <span id="cargo-weight">0 kg</span>
      </div>
    </div>

    <!-- Réticule de visée de la pince -->
    <div id="reticle">
      <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
      <span id="reticle-label"></span>
    </div>

    <!-- Message de capture -->
    <div id="toast"><div id="toast-rarity"></div><div id="toast-name"></div><div id="toast-desc"></div></div>

    <!-- Éclat coloré plein écran (captures épiques et légendaires) -->
    <div id="flash"></div>

    <!-- Inventaire -->
    <div id="inventory">
      <div class="inv-panel">
        <div class="inv-header">
          <span class="inv-title">SOUTE</span>
          <span id="inv-summary"></span>
          <button id="inv-close">✕</button>
        </div>
        <div class="inv-body">
          <div id="inv-grid"></div>
          <div id="inv-details"></div>
        </div>
        <div class="inv-footer">I / TAB : fermer &nbsp;·&nbsp; les prix sont estimés, la marchande décidera</div>
      </div>
    </div>

    <div id="hint">
      ZQSD / WASD : piloter &nbsp;·&nbsp; ESPACE : monter &nbsp;·&nbsp; MAJ : descendre &nbsp;·&nbsp; CLIC : pince &nbsp;·&nbsp; I / TAB : soute
    </div>

    <!-- Fondu au noir (ouverture) -->
    <div id="fade"><p>Port-Kerys, 1984.</p></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
